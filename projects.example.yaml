# Copy this file to projects.local.yaml and replace these example paths.
# Only paths explicitly listed here are staged. Parent directories are never crawled.
projects:
  - id: atns
    rdf:
      - /Users/your-name/Projects/IDN/atns-preservation/build/sandbox/rdf
    vocabs:
      - /Users/your-name/Projects/IDN/atns-preservation/vocabs
    model:
      - /Users/your-name/Projects/IDN/atns-preservation/model.ttl
    data:
      - /Users/your-name/Projects/IDN/atns-preservation/prezdata

  - id: briscoesmith
    rdf:
      # Use the aggregate output, not the whole outputs directory: that directory
      # also contains the component files merged into this catalogue. Loading both
      # copies would duplicate blank nodes such as RiC-O date ranges.
      - /Users/your-name/Projects/IDN/briscoesmith/outputs/briscoesmith-catalogue.ttl
    vocabs:
      - /Users/your-name/Projects/IDN/briscoesmith/vocabs
    data:
      - /Users/your-name/Projects/IDN/briscoesmith/annotations

  # Register shared controlled vocabularies explicitly when source data uses
  # their concepts. Loading the vocabulary supplies labels for those concepts;
  # Prez annotation files are intended for ontology terms and predicates.
  - id: common-vocabs
    vocabs:
      - /Users/your-name/Projects/IDN/reference-resource-register/vocabs/sync/data-access-rights.ttl
