# task setup copies this file to projects.local.yaml. The bundled sample works
# immediately. Replace or extend it with paths to your own RDF when ready.
# Relative paths resolve from the workbench directory. External sources should
# be under ~/Projects, which is mounted read-only into the helper container.
# Only explicitly listed locations are staged.
projects:
  - id: sample
    rdf:
      - examples/sample-catalogue.ttl

